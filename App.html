<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#16202b; --paper:#fff; --surface:#f6f8fa; --rule:#dfe5ec; --muted:#64748b; --good:#0f766e; --good-soft:#e2f2f0; --bad:#b45309; --bad-soft:#fdf0dd; --danger:#b3261e; --focus:#2563eb; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--surface); color:var(--ink); }
  body { font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  button,input,textarea,select { font:inherit; }
  button { cursor:pointer; border:1px solid transparent; border-radius:6px; padding:7px 11px; }
  button:focus-visible,input:focus,textarea:focus,select:focus { outline:2px solid var(--focus); outline-offset:1px; }
  button:disabled { cursor:wait; opacity:.55; }
  input[type="text"],input[type="search"],textarea,select { width:100%; padding:8px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink); }
  textarea { min-height:72px; resize:vertical; }
  #app { min-height:100vh; }
  .topbar { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--paper); border-bottom:1px solid var(--rule); }
  .brand { font-weight:750; letter-spacing:-.01em; white-space:nowrap; }
  nav { display:flex; gap:4px; }
  .nav { background:transparent; color:var(--muted); font-weight:650; }
  .nav.on,.primary { background:var(--ink); color:#fff; font-weight:650; }
  .nav.on:hover,.primary:hover { background:#0d1620; }
  .screen { max-width:1180px; margin:0 auto; padding:20px; }
  .ghost { background:var(--paper); color:var(--ink); border-color:var(--rule); }
  .ghost:hover,.phrase-choice:hover,.history-card:hover { background:var(--surface); }
  .good { background:var(--good); color:#fff; font-weight:650; }
  .bad { background:var(--bad); color:#fff; font-weight:650; }
  .link { padding:3px 5px; background:transparent; color:var(--muted); text-decoration:underline; }
  .link:hover { color:var(--ink); }
  .danger { color:var(--danger); }
  .muted,.hint { color:var(--muted); }
  .hint { margin:5px 0 0; font-size:12px; }
  .section-title { margin:0; font-size:16px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .card,.panel { background:var(--paper); border:1px solid var(--rule); border-radius:9px; }
  .empty { padding:36px 16px; color:var(--muted); text-align:center; }
  .phrase-list,.history,.manage-list { overflow:hidden; }
  .pagination { display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:10px 14px; border-top:1px solid var(--rule); }
  .pagination .muted { margin-right:auto; font-size:12px; }
  .phrase-choice { display:block; width:100%; padding:14px 16px; border-width:0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .phrase-choice:last-child,.manage-item:last-child { border-bottom:0; }
  .id { display:block; margin-top:3px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,Consolas,monospace; }
  .history .section-head { padding:14px 14px 0; }
  .history-list { max-height:calc(100vh - 170px); overflow-y:auto; }
  .history-card { display:block; width:100%; padding:10px 14px; border-width:1px 0 0; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .history-card p { margin:0 0 5px; }
  .history-meta { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }
  .badge { border-radius:999px; padding:1px 7px; font-size:11px; font-weight:700; }
  .badge.good { background:var(--good-soft); color:var(--good); }
  .badge.bad { background:var(--bad-soft); color:var(--bad); }
  .study-tabs { display:flex; gap:4px; margin-bottom:12px; border-bottom:1px solid var(--rule); }
  .study-tab { margin-bottom:-1px; border-color:transparent; border-radius:6px 6px 0 0; background:transparent; color:var(--muted); font-weight:650; }
  .study-tab.on { border-color:var(--rule); border-bottom-color:var(--paper); background:var(--paper); color:var(--ink); }
  .study-search { margin-bottom:12px; }
  .study-card { max-width:720px; margin:28px auto; padding:28px; text-align:center; }
  .question { margin:26px 0; font-size:clamp(24px,5vw,38px); line-height:1.25; font-weight:700; }
  .answer { margin:0 0 22px; font:28px/1.3 Georgia,"Times New Roman",serif; }
  .notes { margin:0 0 22px; color:var(--muted); }
  .study-actions,.form-actions { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
  .manage-grid { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:20px; align-items:start; }
  .manage-item { padding:14px 16px; border-bottom:1px solid var(--rule); }
  .manage-item h3 { margin:0; font:17px/1.3 Georgia,"Times New Roman",serif; }
  .manage-item p { margin:3px 0 0; color:var(--muted); }
  .manage-meta { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tag { border:1px solid var(--rule); border-radius:999px; color:var(--muted); padding:1px 7px; font-size:11px; }
  .manage-side { display:grid; gap:20px; }
  .form-panel,.import-panel { padding:16px; }
  .field { margin-bottom:12px; }
  .ai-actions { display:flex; gap:8px; margin-top:7px; }
  .ai-result { margin:8px 0 0; padding:10px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); white-space:pre-wrap; }
  label { display:block; margin-bottom:4px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
  .import-options { display:flex; gap:14px; margin:9px 0; color:var(--muted); flex-wrap:wrap; }
  .import-options label { display:flex; align-items:center; gap:5px; margin:0; font-size:12px; letter-spacing:0; text-transform:none; }
  .mapping { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .preview { margin-top:12px; overflow-x:auto; }
  .collection-list { overflow:hidden; }
  .collection-choice { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; border-width:0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .collection-choice:last-child { border-bottom:0; }
  .collection-choice:hover { background:var(--surface); }
  .collection-count { margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }
  .collection-player { max-width:720px; margin:28px auto; padding:28px; text-align:center; }
  .player-progress { color:var(--muted); font-size:12px; }
  .player-text { margin:20px 0 24px; font:28px/1.3 Georgia,"Times New Roman",serif; }
  .player-settings { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:22px 0; text-align:left; }
  .collection-editor { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:20px; align-items:start; }
  .collection-members,.collection-candidates { overflow:hidden; }
  .collection-row { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--rule); }
  .collection-row:last-child { border-bottom:0; }
  .collection-row p { margin:2px 0 0; color:var(--muted); }
  .collection-row-actions { display:flex; gap:3px; margin-left:auto; }
  .session-layout { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:20px; align-items:start; text-align:left; }
  .session-player { text-align:center; }
  .session-list { max-height:460px; overflow-y:auto; }
  .session-choice { display:block; width:100%; padding:10px 12px; border-width:0 0 1px; border-radius:0; border-color:var(--rule); background:var(--paper); color:var(--ink); text-align:left; }
  .session-choice:last-child { border-bottom:0; }
  .session-choice:hover,.session-choice.on { background:var(--surface); }
  .session-choice small { display:block; margin-top:2px; color:var(--muted); }
  .phrase-translation { display:block; margin-top:8px; color:var(--muted); font:18px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .session-tools { display:flex; align-items:end; gap:10px; margin:12px 0; }
  .session-tools > div { min-width:150px; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { padding:5px 6px; border:1px solid var(--rule); text-align:left; vertical-align:top; }
  #note { position:fixed; left:50%; bottom:18px; display:none; max-width:min(90vw,600px); padding:9px 13px; border-radius:7px; transform:translateX(-50%); box-shadow:0 4px 16px rgba(15,23,42,.16); }
  #note.show { display:block; }
  #note.ok { background:var(--good-soft); color:var(--good); }
  #note.err { background:#fdecea; color:var(--danger); }
  @media (max-width:760px) { .topbar { padding:10px 14px; flex-wrap:wrap; gap:8px; } .screen { padding:14px; } .manage-grid,.collection-editor,.session-layout { grid-template-columns:1fr; } .manage-side { order:-1; } .history-list { max-height:none; } .study-card,.collection-player { margin:8px 0; padding:22px 16px; } .study-list-panel { padding-bottom:66px; } .study-random { position:fixed; right:14px; bottom:14px; left:14px; z-index:1; } .player-settings { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Frases en alemán</div>
    <nav aria-label="Secciones">
      <button class="nav" data-act="switch-view" data-view="study">Estudiar</button>
      <button class="nav" data-act="switch-view" data-view="collections">Colecciones</button>
      <button class="nav" data-act="switch-view" data-view="manage">Gestionar</button>
      <button class="nav" data-act="switch-view" data-view="etymology">Etimología</button>
    </nav>
  </header>
  <main class="screen" id="screen"></main>
  <div id="note" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    items: [], history: [], view: 'study', detailId: null, revealed: false,
    saving: false, editing: null, studyTab: 'phrases', studyPage: 1, studyQuery: '', managePage: 1, manageQuery: '', importText: '',
    importPreview: null, importHasHeader: true, importDelimiter: ',',
    etymologyText: '', etymologyResult: '',
    collections: [], collectionsLoaded: false, collectionQuery: '', collectionId: null, collection: null, collectionEditor: null, collectionPhraseQuery: '',
    session: { phase:'free', order:'manual', items:[], supports:{ german:true, spanish:false } },
    playerSettings: playerSettings_()
  };
  var player = { index:0, repetition:0, playing:false, timer:null, token:0, voice:null };
  var PAGE_SIZE = 25;
  var el = {
    app: document.getElementById('app'), screen: document.getElementById('screen'),
    note: document.getElementById('note')
  };

  function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function say(message, kind) {
    el.note.textContent = message;
    el.note.className = 'show ' + (kind || 'ok');
    clearTimeout(say.timer);
    say.timer = setTimeout(function () { el.note.className = ''; }, 3500);
  }

  function playerSettings_() {
    var defaults = { rate:1, pause:1000, reps:1 };
    try {
      var saved = JSON.parse(localStorage.getItem('deutsch-player-settings') || '{}');
      if ([0.75, 1, 1.25].indexOf(Number(saved.rate)) !== -1) defaults.rate = Number(saved.rate);
      if ([500, 1000, 2000, 3000].indexOf(Number(saved.pause)) !== -1) defaults.pause = Number(saved.pause);
      if ([1, 2, 3, 4, 5].indexOf(Number(saved.reps)) !== -1) defaults.reps = Number(saved.reps);
    } catch (err) {}
    return defaults;
  }

  function savePlayerSettings_() {
    try { localStorage.setItem('deutsch-player-settings', JSON.stringify(state.playerSettings)); } catch (err) {}
  }

  function germanVoice_() {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return null;
    var voices = window.speechSynthesis.getVoices();
    function language(voice) { return String(voice.lang || '').toLowerCase().replace('_', '-'); }
    var exact = voices.filter(function (voice) { return language(voice) === 'de-de'; })[0];
    return exact || voices.filter(function (voice) { return language(voice).indexOf('de') === 0; })[0] || null;
  }

  function phaseDefaults_(phase) {
    if (phase === 'understand') return { german:true, spanish:true };
    if (phase === 'listen') return { german:false, spanish:false };
    if (phase === 'shadow') return { german:true, spanish:false };
    if (phase === 'recall') return { german:false, spanish:true };
    return { german:true, spanish:false };
  }

  function shuffledItems_(items) {
    var shuffled = items.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var item = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = item;
    }
    return shuffled;
  }

  function sessionItems_() {
    return state.session.items;
  }

  function resetPhraseSupports_() {
    state.session.supports = phaseDefaults_(state.session.phase);
  }

  function resetSession_(phase, order) {
    state.session.phase = phase || state.session.phase;
    state.session.order = order || state.session.order;
    var items = state.collection ? state.collection.items : [];
    state.session.items = state.session.order === 'random' ? shuffledItems_(items) : items.slice();
    player.index = 0;
    player.repetition = 0;
    resetPhraseSupports_();
  }

  function currentPlayerItem_() {
    return sessionItems_()[player.index] || null;
  }

  function nextPlaybackPosition(length, index, repetition, repetitions) {
    repetition++;
    if (repetition >= repetitions) return { index:(index + 1) % length, repetition:0 };
    return { index:index, repetition:repetition };
  }

  function playerVoiceReady_() {
    player.voice = germanVoice_();
    return player.voice;
  }

  function recallPhase_() {
    return state.session.phase === 'recall';
  }

  function phraseTextHtml_(item) {
    if (!item) return '';
    var supports = state.session.supports;
    var text = supports.german ? '<span>' + esc(item.de) + '</span>' : '';
    if (supports.spanish) text += '<span class="phrase-translation">' + esc(item.es || 'Sin traducción') + '</span>';
    return text || '<span class="muted">Escuchá antes de revelar el texto.</span>';
  }

  function updatePlayerUi_() {
    var item = currentPlayerItem_();
    var text = document.getElementById('player-text');
    var progress = document.getElementById('player-progress');
    var toggle = document.getElementById('player-toggle');
    var note = document.getElementById('player-audio-note');
    var germanSupport = document.getElementById('support-german');
    var spanishSupport = document.getElementById('support-spanish');
    var hasVoice = playerVoiceReady_();
    var items = sessionItems_();
    if (text) text.innerHTML = phraseTextHtml_(item);
    if (progress) progress.textContent = item ? (player.index + 1) + ' de ' + items.length : '';
    if (toggle) {
      toggle.disabled = !hasVoice || !item || (recallPhase_() && !state.session.supports.german);
      toggle.textContent = player.playing ? 'Pausar' : (recallPhase_() ? 'Escuchar respuesta' : 'Escuchar');
    }
    if (note) note.textContent = hasVoice ? 'Voz alemana de este navegador.' : 'No hay una voz alemana disponible en este navegador.';
    if (germanSupport) germanSupport.textContent = state.session.supports.german ? 'Ocultar alemán' : 'Mostrar alemán';
    if (spanishSupport) spanishSupport.textContent = state.session.supports.spanish ? 'Ocultar español' : 'Mostrar español';
    var previous = document.querySelector('.session-choice.on');
    if (previous) previous.classList.remove('on');
    var active = document.querySelector('.session-choice[data-index="' + player.index + '"]');
    if (active) active.classList.add('on');
  }

  function stopPlayer_() {
    player.playing = false;
    player.token++;
    if (player.timer) clearTimeout(player.timer);
    player.timer = null;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    updatePlayerUi_();
  }

  function playPlayerCycle_(token) {
    if (!player.playing || token !== player.token) return;
    var item = currentPlayerItem_();
    if (!item || !playerVoiceReady_()) return stopPlayer_();

    var utterance = new SpeechSynthesisUtterance(item.de);
    utterance.lang = player.voice.lang || 'de-DE';
    utterance.voice = player.voice;
    utterance.rate = state.playerSettings.rate;
    utterance.onend = function () {
      if (!player.playing || token !== player.token) return;
      player.timer = setTimeout(function () {
        if (!player.playing || token !== player.token) return;
        if (recallPhase_() && player.repetition + 1 >= state.playerSettings.reps) {
          player.playing = false;
          player.repetition = 0;
          player.timer = null;
          return updatePlayerUi_();
        }
        var next = nextPlaybackPosition(sessionItems_().length, player.index, player.repetition, state.playerSettings.reps);
        player.index = next.index;
        player.repetition = next.repetition;
        if (next.repetition === 0) resetPhraseSupports_();
        player.timer = null;
        updatePlayerUi_();
        playPlayerCycle_(token);
      }, state.playerSettings.pause);
    };
    utterance.onerror = function (event) {
      if (!player.playing || token !== player.token || event.error === 'canceled' || event.error === 'interrupted') return;
      stopPlayer_();
      say('No se pudo reproducir la voz alemana.', 'err');
    };
    updatePlayerUi_();
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }

  function startPlayer_() {
    if (!sessionItems_().length || (recallPhase_() && !state.session.supports.german)) return;
    if (!playerVoiceReady_()) { updatePlayerUi_(); return; }
    player.playing = true;
    var token = ++player.token;
    playPlayerCycle_(token);
  }

  function togglePlayer_() {
    if (player.playing) stopPlayer_(); else startPlayer_();
  }

  function movePlayer_(direction) {
    if (!sessionItems_().length) return;
    var resume = player.playing;
    stopPlayer_();
    player.index = (player.index + direction + sessionItems_().length) % sessionItems_().length;
    player.repetition = 0;
    resetPhraseSupports_();
    updatePlayerUi_();
    if (resume && !recallPhase_()) startPlayer_();
  }

  function restartPlayer_() {
    var resume = player.playing;
    stopPlayer_();
    player.repetition = 0;
    updatePlayerUi_();
    if (resume) startPlayer_();
  }

  function restartSession_() {
    var resume = player.playing;
    stopPlayer_();
    player.index = 0;
    player.repetition = 0;
    resetPhraseSupports_();
    updatePlayerUi_();
    if (resume && !recallPhase_()) startPlayer_();
  }

  function setPlayerSetting_(name, value) {
    var next = Number(value);
    if (state.playerSettings[name] === next) return;
    var resume = player.playing;
    stopPlayer_();
    state.playerSettings[name] = next;
    savePlayerSettings_();
    updatePlayerUi_();
    if (resume) startPlayer_();
  }

  function setPhase_(phase) {
    stopPlayer_();
    resetSession_(phase, state.session.order);
    renderCollections();
  }

  function setSessionOrder_(order) {
    stopPlayer_();
    resetSession_(state.session.phase, order);
    renderCollections();
  }

  function selectSessionItem_(index) {
    if (index < 0 || index >= sessionItems_().length) return;
    stopPlayer_();
    player.index = index;
    player.repetition = 0;
    resetPhraseSupports_();
    renderCollections();
    if (!recallPhase_()) startPlayer_();
  }

  function toggleSupport_(support) {
    if (recallPhase_() && support === 'german' && state.session.supports.german) stopPlayer_();
    state.session.supports[support] = !state.session.supports[support];
    if (recallPhase_() && support === 'german') renderCollections(); else updatePlayerUi_();
  }

  function byId(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) return state.items[i];
    }
    return null;
  }

  function randomCandidate(items, history) {
    var recent = {};
    history.forEach(function (entry) { recent[entry.id] = true; });
    var candidates = items.filter(function (item) { return !recent[item.id]; });
    return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
  }

  function dateLabel(value) {
    var date = new Date(value);
    return isNaN(date.getTime()) ? '' : date.toLocaleString('es-AR', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  }

  function phrasesToText(items) {
    var shuffled = items.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var item = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = item;
    }
    return shuffled.map(function (item) {
      return String(item.de == null ? '' : item.de).trim().replace(/\s+/g, ' ');
    }).filter(Boolean).map(function (text) {
      return /[.!?…]$/.test(text) ? text : text + '.';
    }).join('\n\n');
  }

  function fallbackCopyText(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    var copied = document.execCommand('copy');
    area.remove();
    if (!copied) throw new Error('No se pudo acceder al portapapeles.');
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { fallbackCopyText(text); });
    }
    fallbackCopyText(text);
    return Promise.resolve();
  }

  function matchingItems(items, query) {
    query = String(query || '').toLowerCase();
    if (!query) return items;
    return items.filter(function (item) {
      return (item.id + ' ' + item.de + ' ' + item.es + ' ' + item.notes + ' ' +
        item.tags.join(' ')).toLowerCase().indexOf(query) !== -1;
    });
  }

  function managedItems() {
    return matchingItems(state.items, state.manageQuery);
  }

  function studyItems() {
    return matchingItems(state.items, state.studyQuery);
  }

  function paginate(items, requestedPage) {
    var total = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    var page = Math.min(Math.max(1, requestedPage), total);
    return { items:items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE), page:page, total:total };
  }

  function paginationHtml(list, page) {
    if (page.total === 1) return '';
    return '<div class="pagination" aria-label="Paginación"><span class="muted">Página ' + page.page + ' de ' + page.total + '</span>' +
      '<button class="ghost" data-act="page" data-list="' + list + '" data-direction="-1"' + (page.page === 1 ? ' disabled' : '') + '>Anterior</button>' +
      '<button class="ghost" data-act="page" data-list="' + list + '" data-direction="1"' + (page.page === page.total ? ' disabled' : '') + '>Siguiente</button></div>';
  }

  function historyHtml() {
    if (!state.history.length) return '<div class="empty">Todavía no estudiaste frases.</div>';
    var cards = state.history.map(function (entry) {
      var item = byId(entry.id);
      if (!item) return '';
      return '<button class="history-card" data-act="study" data-id="' + esc(item.id) + '">' +
        '<p>' + esc(item.es || 'Sin traducción') + '</p><span class="history-meta">' +
        '<span class="badge ' + (entry.correct ? 'good' : 'bad') + '">' +
        (entry.correct ? 'Bien' : 'Mal') + '</span>' + esc(dateLabel(entry.reviewedAt)) +
        '</span></button>';
    }).join('');
    return cards || '<div class="empty">No hay frases disponibles.</div>';
  }

  function historyPanelHtml() {
    return '<section class="card history" id="history-panel"><div class="section-head"><h2 class="section-title">Últimas 20</h2><span class="muted">' +
      state.history.length + '/20</span></div><div class="history-list">' + historyHtml() + '</div></section>';
  }

  function studyListHtml() {
    if (!state.items.length) {
      return '<div class="empty"><p>No hay frases cargadas.</p>' +
        '<button class="primary" data-act="switch-view" data-view="manage">Agregar frases</button></div>';
    }
    var items = studyItems();
    if (!items.length) return '<div class="empty">No hay frases que coincidan.</div>';
    var page = paginate(items, state.studyPage);
    state.studyPage = page.page;
    return page.items.map(function (item) {
      return '<button class="phrase-choice" data-act="study" data-id="' + esc(item.id) + '">' +
        esc(item.es || 'Sin traducción') + '</button>';
    }).join('');
  }

  function studyPaginationHtml() {
    var page = paginate(studyItems(), state.studyPage);
    state.studyPage = page.page;
    return paginationHtml('study', page);
  }

  function studyTabsHtml() {
    return '<div class="study-tabs" role="group" aria-label="Modo estudio">' +
      '<button class="study-tab' + (state.studyTab === 'phrases' ? ' on' : '') + '" aria-pressed="' + (state.studyTab === 'phrases') + '" data-act="study-tab" data-tab="phrases">Frases</button>' +
      '<button class="study-tab' + (state.studyTab === 'history' ? ' on' : '') + '" aria-pressed="' + (state.studyTab === 'history') + '" data-act="study-tab" data-tab="history">Historial</button></div>';
  }

  function studyListPanelHtml() {
    return '<section class="study-list-panel" id="study-phrases"><div class="section-head"><h1 class="section-title">Elegí una frase</h1><button class="primary study-random" data-act="random">Random</button></div>' +
      '<input class="study-search" id="study-search" type="search" placeholder="Buscar frases…" value="' + esc(state.studyQuery) + '"><div class="card phrase-list" id="study-list">' + studyListHtml() + studyPaginationHtml() + '</div></section>';
  }

  function renderStudyList() {
    var target = document.getElementById('study-list');
    if (target) target.innerHTML = studyListHtml() + studyPaginationHtml();
  }

  function renderStudy() {
    var item = state.detailId ? byId(state.detailId) : null;
    if (state.detailId && !item) { state.detailId = null; state.revealed = false; }
    var content;
    if (state.studyTab === 'history') content = historyPanelHtml();
    else if (item) {
      content = '<section class="card study-card" id="study-phrases"><button class="link" data-act="back-study">← Volver al listado</button>' +
        '<p class="question">' + esc(item.es || 'Sin traducción') + '</p>' +
        (state.revealed
          ? '<p class="answer">' + esc(item.de) + '</p>' + (item.notes ? '<p class="notes">' + esc(item.notes) + '</p>' : '') +
            '<div class="study-actions"><button class="good" data-act="result" data-correct="true"' + (state.saving ? ' disabled' : '') + '>Lo hice bien</button>' +
            '<button class="bad" data-act="result" data-correct="false"' + (state.saving ? ' disabled' : '') + '>Me costó</button><button class="ghost" data-act="edit" data-id="' + esc(item.id) + '">Editar frase</button></div>'
          : '<div class="study-actions"><button class="primary" data-act="reveal">Ver alemán</button></div>') +
        '</section>';
    } else content = studyListPanelHtml();
    el.screen.innerHTML = '<div class="study">' + studyTabsHtml() + content + '</div>';
  }

  function editorHtml() {
    var item = state.editing ? byId(state.editing) : null;
    if (state.editing === null) {
      return '<section class="panel form-panel"><div class="section-head"><h2 class="section-title">Frases</h2><button class="primary" data-act="new">Nueva frase</button></div>' +
        '<p class="hint">Las frases nuevas se pueden cargar una por una o importar abajo.</p></section>';
    }
    return '<section class="panel form-panel"><div class="section-head"><h2 class="section-title">' + (item ? 'Editar ' + esc(item.id) : 'Nueva frase') + '</h2></div>' +
      '<div class="field"><label for="f-de">Frase en alemán</label><textarea id="f-de">' + esc(item ? item.de : '') + '</textarea><div class="ai-actions"><button id="ai-translate-to-es" class="ghost" data-act="translate-to-es">Traducir al español</button></div></div>' +
      '<div class="field"><label for="f-es">Traducción al español</label><textarea id="f-es">' + esc(item ? item.es : '') + '</textarea><div class="ai-actions"><button id="ai-translate" class="ghost" data-act="translate">Traducir al alemán</button></div></div>' +
      '<div class="field"><label for="f-notes">Notas</label><input id="f-notes" type="text" value="' + esc(item ? item.notes : '') + '"></div>' +
      '<div class="field"><label for="f-tags">Etiquetas</label><input id="f-tags" type="text" value="' + esc(item ? item.tags.join(', ') : '') + '" placeholder="viaje, trabajo, A2"></div>' +
      (item ? '<div class="field"><label>Colecciones</label><p class="hint">' + esc(item.collections && item.collections.length ? item.collections.join(', ') : 'Sin colección') + '</p></div>' : '') +
      '<div class="form-actions"><button class="primary" data-act="save-phrase">' + (item ? 'Guardar cambios' : 'Agregar frase') + '</button><button class="ghost" data-act="cancel-editor">Cancelar</button></div></section>';
  }

  function optionHtml(count) {
    var options = '';
    for (var i = 0; i < count; i++) options += '<option value="' + i + '">Columna ' + (i + 1) + '</option>';
    return options;
  }

  function importHtml() {
    var preview = state.importPreview;
    var rows = preview ? preview.data.rows.map(function (row) {
      var cells = '';
      for (var i = 0; i < preview.data.columnCount; i++) cells += '<td>' + esc(row[i] || '') + '</td>';
      return '<tr>' + cells + '</tr>';
    }).join('') : '';
    return '<section class="panel import-panel"><h2 class="section-title">Importar CSV / TSV</h2><p class="hint">Pegá el contenido, elegí el separador y mapeá alemán y español.</p>' +
      '<textarea id="import-text" placeholder="Deutsch,Español\nGuten Morgen,Buenos días">' + esc(state.importText) + '</textarea><div class="import-options">' +
      '<label><input type="radio" name="delimiter" value=","' + (state.importDelimiter === ',' ? ' checked' : '') + '> Coma</label>' +
      '<label><input type="radio" name="delimiter" value="tab"' + (state.importDelimiter === '\t' ? ' checked' : '') + '> Tab</label>' +
      '<label><input id="import-header" type="checkbox"' + (state.importHasHeader ? ' checked' : '') + '> Primera fila: encabezados</label></div><button class="ghost" data-act="preview-import">Ver vista previa</button>' +
      (preview ? '<div class="preview"><div class="mapping"><div><label for="import-de">Columna alemana</label><select id="import-de">' + optionHtml(preview.data.columnCount) + '</select></div>' +
        '<div><label for="import-es">Columna española</label><select id="import-es">' + optionHtml(preview.data.columnCount) + '</select></div></div><table><tbody>' + rows + '</tbody></table>' +
        '<div class="form-actions" style="margin-top:12px"><button class="primary" data-act="import">Importar</button></div></div>' : '') + '</section>';
  }

  function manageListHtml() {
    var items = managedItems();
    if (!items.length) return '<div class="empty">No hay frases que coincidan.</div>';
    var page = paginate(items, state.managePage);
    state.managePage = page.page;
    return page.items.map(function (item) {
      return '<article class="manage-item"><h3>' + esc(item.de) + '</h3><p>' + esc(item.es || 'Sin traducción') + '</p>' +
        (item.notes ? '<p class="hint">' + esc(item.notes) + '</p>' : '') + '<div class="manage-meta">' +
        item.tags.map(function (tag) { return '<span class="tag">#' + esc(tag) + '</span>'; }).join('') +
        '<span class="muted">' + esc(item.id) + '</span><span style="flex:1"></span><button class="link" data-act="edit" data-id="' + esc(item.id) + '">Editar</button>' +
        '<button class="link danger" data-act="delete" data-id="' + esc(item.id) + '">Borrar</button></div></article>';
    }).join('') + paginationHtml('manage', page);
  }

  function renderManageList() {
    var target = document.getElementById('manage-list');
    if (target) target.innerHTML = manageListHtml();
  }

  function renderManage() {
    el.screen.innerHTML = '<div class="manage-grid"><section><div class="section-head"><h1 class="section-title">Gestionar frases</h1><button class="ghost" data-act="copy">Copiar alemán al azar</button></div>' +
      '<input id="manage-search" type="search" placeholder="Buscar frases…" value="' + esc(state.manageQuery) + '"><div class="card manage-list" id="manage-list">' + manageListHtml() + '</div></section>' +
      '<aside class="manage-side">' + editorHtml() + importHtml() + '</aside></div>';
  }

  function collectionCatalogHtml() {
    if (!state.collectionsLoaded) return '<div class="empty">Cargando colecciones…</div>';
    var query = String(state.collectionQuery || '').toLowerCase();
    var collections = state.collections.filter(function (collection) {
      return !query || collection.name.toLowerCase().indexOf(query) !== -1;
    });
    var rows = collections.map(function (collection) {
      return '<button class="collection-choice" data-act="open-collection" data-id="' + esc(collection.id) + '"><span>' + esc(collection.name) + '</span><span class="collection-count">' + collection.count + ' frases</span></button>';
    }).join('');
    return '<section><div class="section-head"><h1 class="section-title">Colecciones</h1><button class="primary" data-act="new-collection">Nueva colección</button></div>' +
      '<input id="collection-search" type="search" placeholder="Buscar colecciones…" value="' + esc(state.collectionQuery) + '"><div class="card collection-list" style="margin-top:12px">' +
      (rows || '<div class="empty">No hay colecciones que coincidan.</div>') + '</div></section>';
  }

  function playerOptionsHtml(values, current, suffix) {
    return values.map(function (value) {
      var label = suffix === ' s' ? value / 1000 + suffix : suffix ? value + suffix : value;
      return '<option value="' + value + '"' + (Number(value) === Number(current) ? ' selected' : '') + '>' + label + '</option>';
    }).join('');
  }

  function sessionListHtml_() {
    return sessionItems_().map(function (item, index) {
      var label = 'Frase ' + (index + 1);
      var detail = '';
      if (state.session.phase === 'understand') { label = item.de; detail = item.es || 'Sin traducción'; }
      else if (state.session.phase === 'free' || state.session.phase === 'shadow') label = item.de;
      else if (state.session.phase === 'recall') label = item.es || 'Sin traducción';
      return '<button class="session-choice' + (index === player.index ? ' on' : '') + '" data-act="select-session-item" data-index="' + index + '">' + esc(label) + (detail ? '<small>' + esc(detail) + '</small>' : '') + '</button>';
    }).join('');
  }

  function collectionPlayerHtml() {
    var collection = state.collection;
    if (!collection) return '<div class="empty">Cargando colección…</div>';
    if (!collection.items.length) {
      return '<section class="card collection-player"><button class="link" data-act="collection-back">← Volver a colecciones</button><h1 class="section-title" style="margin-top:14px">' + esc(collection.collection.name) + '</h1><div class="empty">Esta colección no tiene frases.</div>' +
        (collection.collection.unassigned ? '' : '<button class="ghost" data-act="edit-collection">Agregar frases</button>') + '</section>';
    }
    var phase = state.session.phase;
    var hasVoice = !!playerVoiceReady_();
    var audioVisible = phase !== 'recall' || state.session.supports.german;
    var phases = [['free', 'Libre'], ['understand', '1 Comprensión'], ['listen', '2 Escucha'], ['shadow', '3 Repetición'], ['recall', '4 Recuperación']];
    var tabs = phases.map(function (entry) {
      return '<button class="study-tab' + (phase === entry[0] ? ' on' : '') + '" data-act="set-phase" data-phase="' + entry[0] + '" aria-pressed="' + (phase === entry[0]) + '">' + entry[1] + '</button>';
    }).join('');
    return '<section class="collection-player"><div class="section-head"><button class="link" data-act="collection-back">← Colecciones</button>' +
      (collection.collection.unassigned ? '' : '<button class="link" data-act="edit-collection">Editar colección</button>') + '</div><h1 class="section-title">' + esc(collection.collection.name) + '</h1>' +
      '<div class="study-tabs" role="group" aria-label="Fase de estudio">' + tabs + '</div><div class="session-tools"><div><label for="session-order">Orden</label><select id="session-order"><option value="manual"' + (state.session.order === 'manual' ? ' selected' : '') + '>Manual</option><option value="random"' + (state.session.order === 'random' ? ' selected' : '') + '>Aleatorio</option></select></div></div>' +
      '<div class="session-layout"><section class="card session-player"><p class="player-progress" id="player-progress"></p><p class="player-text" id="player-text"></p>' +
      (phase === 'recall' ? '<p class="hint">Decí la frase en alemán antes de revelar la respuesta.</p>' : '') + (audioVisible ? '<p class="hint" id="player-audio-note"></p>' : '') +
      '<div class="study-actions"><button class="ghost" id="support-german" data-act="toggle-support" data-support="german"></button><button class="ghost" id="support-spanish" data-act="toggle-support" data-support="spanish"></button></div>' +
      (audioVisible ? '<div class="player-settings"><div><label for="player-rate">Velocidad</label><select id="player-rate">' + playerOptionsHtml([0.75, 1, 1.25], state.playerSettings.rate, '×') + '</select></div>' +
      '<div><label for="player-pause">Pausa</label><select id="player-pause">' + playerOptionsHtml([500, 1000, 2000, 3000], state.playerSettings.pause, ' s') + '</select></div>' +
      '<div><label for="player-reps">Repeticiones</label><select id="player-reps">' + playerOptionsHtml([1, 2, 3, 4, 5], state.playerSettings.reps, '') + '</select></div></div>' : '') +
      '<div class="study-actions"><button class="ghost" data-act="player-previous">← Anterior</button>' + (audioVisible ? '<button class="primary" id="player-toggle" data-act="player-toggle"' + (hasVoice ? '' : ' disabled') + '>Escuchar</button><button class="ghost" data-act="player-restart">Reiniciar frase</button>' : '') + '<button class="ghost" data-act="player-next">Siguiente →</button><button class="ghost" data-act="player-restart-list">Volver al inicio</button></div></section>' +
      '<section class="card session-list"><div class="section-head" style="padding:12px 12px 0"><h2 class="section-title">Frases</h2><span class="muted">' + sessionItems_().length + '</span></div>' + sessionListHtml_() + '</section></div></section>';
  }

  function collectionCandidates_() {
    var current = {};
    (state.collection && state.collection.items || []).forEach(function (item) { current[item.id] = true; });
    return matchingItems(state.items, state.collectionPhraseQuery).filter(function (item) { return !current[item.id]; }).slice(0, 25);
  }

  function collectionEditorHtml() {
    if (state.collectionEditor === 'new') {
      return '<section class="panel form-panel" style="max-width:620px"><div class="section-head"><h1 class="section-title">Nueva colección</h1></div><div class="field"><label for="collection-name">Nombre</label><input id="collection-name" type="text" placeholder="Por ejemplo: Mi trabajo"></div><div class="form-actions"><button class="primary" data-act="save-collection">Crear colección</button><button class="ghost" data-act="cancel-collection-editor">Cancelar</button></div></section>';
    }
    var collection = state.collection;
    if (!collection) return '<div class="empty">Cargando colección…</div>';
    var members = collection.items.map(function (item, index) {
      return '<div class="collection-row"><div><strong>' + esc(item.de) + '</strong><p>' + esc(item.es) + '</p></div><div class="collection-row-actions"><button class="link" data-act="move-collection-phrase" data-id="' + esc(item.id) + '" data-direction="-1"' + (index === 0 ? ' disabled' : '') + '>↑</button><button class="link" data-act="move-collection-phrase" data-id="' + esc(item.id) + '" data-direction="1"' + (index === collection.items.length - 1 ? ' disabled' : '') + '>↓</button><button class="link danger" data-act="remove-collection-phrase" data-id="' + esc(item.id) + '">Quitar</button></div></div>';
    }).join('') || '<div class="empty">Todavía no agregaste frases.</div>';
    var candidates = collectionCandidates_().map(function (item) {
      return '<div class="collection-row"><div><strong>' + esc(item.de) + '</strong><p>' + esc(item.es) + '</p></div><button class="link" data-act="add-collection-phrase" data-id="' + esc(item.id) + '">Agregar</button></div>';
    }).join('') || '<div class="empty">No hay frases para agregar.</div>';
    return '<section><div class="section-head"><h1 class="section-title">Editar colección</h1><button class="link danger" data-act="delete-collection">Borrar colección</button></div><div class="field" style="max-width:620px"><label for="collection-name">Nombre</label><input id="collection-name" type="text" value="' + esc(collection.collection.name) + '"></div><div class="form-actions" style="justify-content:flex-start; margin-bottom:20px"><button class="primary" data-act="save-collection">Guardar nombre</button><button class="ghost" data-act="cancel-collection-editor">Volver al reproductor</button></div><div class="collection-editor"><section class="card collection-members"><div class="section-head" style="padding:14px 14px 0"><h2 class="section-title">Frases de la colección</h2><span class="muted">' + collection.items.length + '</span></div>' + members + '</section><section><div class="section-head"><h2 class="section-title">Agregar frases</h2></div><input id="collection-phrase-search" type="search" placeholder="Buscar frases…" value="' + esc(state.collectionPhraseQuery) + '"><div class="card collection-candidates" style="margin-top:12px">' + candidates + '</div></section></div></section>';
  }

  function renderCollections() {
    if (state.collectionEditor) el.screen.innerHTML = collectionEditorHtml();
    else if (state.collectionId) el.screen.innerHTML = collectionPlayerHtml();
    else el.screen.innerHTML = collectionCatalogHtml();
    if (state.collectionId && !state.collectionEditor) updatePlayerUi_();
  }

  function renderEtymology() {
    var result = state.etymologyResult;
    el.screen.innerHTML = '<section class="panel form-panel" style="max-width:720px"><div class="section-head"><h1 class="section-title">Etimología</h1></div>' +
      '<p class="hint">Analizá una palabra o frase sin guardarla en tu registro.</p>' +
      '<div class="field"><label for="etymology-source">Palabra o frase</label><textarea id="etymology-source" placeholder="zum Beispiel: verstehen">' + esc(state.etymologyText) + '</textarea></div>' +
      '<div class="ai-actions"><button id="ai-etymology" class="ghost" data-act="etymology">Analizar etimología</button></div>' +
      '<div id="ai-etymology-result" class="ai-result" role="status" aria-live="polite"' + (result ? '' : ' hidden') + '>' + esc(result) + '</div></section>';
  }

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.nav'), function (button) {
      button.className = 'nav' + (button.dataset.view === state.view ? ' on' : '');
    });
    if (state.view === 'study') renderStudy(); else if (state.view === 'collections') renderCollections(); else if (state.view === 'manage') renderManage(); else renderEtymology();
  }

  function loadCollections_(done) {
    google.script.run.withSuccessHandler(function (collections) {
      state.collections = collections;
      state.collectionsLoaded = true;
      if (done) done();
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).listCollections();
  }

  function fetchCollection_(id, done) {
    google.script.run.withSuccessHandler(function (collection) {
      done(collection);
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).getCollection(id);
  }

  function openCollection(id) {
    stopPlayer_();
    state.collectionId = id;
    state.collection = null;
    state.collectionEditor = null;
    player.index = 0;
    player.repetition = 0;
    render();
    fetchCollection_(id, function (collection) {
      if (state.view !== 'collections' || state.collectionId !== id) return;
      state.collection = collection;
      resetSession_('free', 'manual');
      loadCollections_(render);
    });
  }

  function reloadOpenCollection_() {
    var id = state.collectionId;
    if (!id) return;
    stopPlayer_();
    fetchCollection_(id, function (collection) {
      if (state.view !== 'collections' || state.collectionId !== id) return;
      state.collection = collection;
      resetSession_('free', 'manual');
      loadCollections_(render);
    });
  }

  function saveCollection() {
    var input = document.getElementById('collection-name');
    var name = input && input.value;
    if (!String(name || '').trim()) return say('Escribí un nombre para la colección.', 'err');
    if (state.collectionEditor === 'new') {
      google.script.run.withSuccessHandler(function (collection) {
        state.collectionEditor = null;
        loadCollections_(function () { openCollection(collection.id); });
      }).withFailureHandler(function (err) { say(err.message, 'err'); }).createCollection({ name:name });
      return;
    }
    google.script.run.withSuccessHandler(function () {
      reloadOpenCollection_();
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).renameCollection({ id:state.collectionId, name:name });
  }

  function deleteCurrentCollection() {
    var collection = state.collection && state.collection.collection;
    if (!collection || collection.unassigned || !confirm('Borrar la colección "' + collection.name + '"? Las frases se conservan.')) return;
    stopPlayer_();
    google.script.run.withSuccessHandler(function () {
      state.collectionId = null;
      state.collection = null;
      state.collectionEditor = null;
      loadCollections_(render);
      say('Colección borrada.');
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).deleteCollection(collection.id);
  }

  function changeCollectionPhrase(action, id, direction) {
    var collectionId = state.collectionId;
    if (!collectionId) return;
    var runner = google.script.run.withSuccessHandler(function () {
      reloadOpenCollection_();
    }).withFailureHandler(function (err) { say(err.message, 'err'); });
    if (action === 'add') runner.addCollectionPhrase({ collectionId:collectionId, phraseId:id });
    else if (action === 'remove') runner.removeCollectionPhrase({ collectionId:collectionId, phraseId:id });
    else runner.moveCollectionPhrase({ collectionId:collectionId, phraseId:id, direction:direction });
  }

  function openStudy(id) {
    if (!byId(id)) return;
    state.studyTab = 'phrases';
    state.detailId = id;
    state.revealed = false;
    render();
  }

  function recordResult(correct) {
    if (!state.detailId || state.saving) return;
    state.saving = true;
    render();
    google.script.run.withSuccessHandler(function (data) {
      state.history = data.history;
      state.saving = false;
      state.detailId = null;
      state.revealed = false;
      render();
      say(correct ? 'Marcada como bien.' : 'Marcada como mal.');
    }).withFailureHandler(function (err) {
      state.saving = false;
      render();
      say(err.message, 'err');
    }).recordStudy(state.detailId, correct);
  }

  function savePhrase() {
    var id = state.editing || '';
    var payload = { id:id, de:document.getElementById('f-de').value, es:document.getElementById('f-es').value,
      notes:document.getElementById('f-notes').value, tags:document.getElementById('f-tags').value };
    if (!payload.de.trim()) return say('Escribí la frase en alemán antes de guardar.', 'err');
    var runner = google.script.run.withSuccessHandler(function (item) {
      if (id) item.collections = byId(id).collections || [];
      else item.collections = [];
      if (id) state.items[state.items.indexOf(byId(id))] = item; else state.items.unshift(item);
      state.collectionsLoaded = false;
      state.collectionId = null;
      state.collection = null;
      state.collectionEditor = null;
      state.editing = null;
      render();
      say(id ? 'Cambios guardados.' : 'Frase agregada.');
    }).withFailureHandler(function (err) { say(err.message, 'err'); });
    if (id) runner.updatePhrase(payload); else runner.createPhrase(payload);
  }

  function restoreAiButton(button, label) {
    if (!document.body.contains(button)) return;
    button.disabled = false;
    button.textContent = label;
  }

  function translateToGerman() {
    var source = document.getElementById('f-es');
    var button = document.getElementById('ai-translate');
    if (!source || !button) return;
    if (!source.value.trim()) return say('Escribí la frase en español antes de traducir.', 'err');
    button.disabled = true;
    button.textContent = 'Traduciendo…';
    google.script.run.withSuccessHandler(function (translation) {
      if (document.body.contains(button)) {
        var target = document.getElementById('f-de');
        if (target) target.value = translation;
      }
      restoreAiButton(button, 'Traducir al alemán');
      say('Propuesta en alemán lista.');
    }).withFailureHandler(function (err) {
      restoreAiButton(button, 'Traducir al alemán');
      say(err.message, 'err');
    }).suggestGermanTranslation(source.value);
  }

  function translateToSpanish() {
    var source = document.getElementById('f-de');
    var button = document.getElementById('ai-translate-to-es');
    if (!source || !button) return;
    if (!source.value.trim()) return say('Escribí la frase en alemán antes de traducir.', 'err');
    button.disabled = true;
    button.textContent = 'Traduciendo…';
    google.script.run.withSuccessHandler(function (translation) {
      if (document.body.contains(button)) {
        var target = document.getElementById('f-es');
        if (target) target.value = translation;
      }
      restoreAiButton(button, 'Traducir al español');
      say('Propuesta en español lista.');
    }).withFailureHandler(function (err) {
      restoreAiButton(button, 'Traducir al español');
      say(err.message, 'err');
    }).suggestSpanishTranslation(source.value);
  }

  function showEtymology() {
    var source = document.getElementById('etymology-source');
    var button = document.getElementById('ai-etymology');
    var result = document.getElementById('ai-etymology-result');
    if (!source || !button || !result) return;
    if (!source.value.trim()) return say('Escribí la palabra o frase en alemán antes de analizarla.', 'err');
    state.etymologyText = source.value;
    state.etymologyResult = '';
    button.disabled = true;
    button.textContent = 'Analizando…';
    result.hidden = false;
    result.textContent = 'Analizando etimología…';
    google.script.run.withSuccessHandler(function (text) {
      state.etymologyResult = text;
      if (document.body.contains(result)) result.textContent = text;
      restoreAiButton(button, 'Analizar etimología');
    }).withFailureHandler(function (err) {
      if (document.body.contains(result)) {
        result.hidden = true;
        result.textContent = '';
      }
      restoreAiButton(button, 'Analizar etimología');
      say(err.message, 'err');
    }).analyzeEtymology(source.value);
  }

  function removePhrase(id) {
    if (!byId(id) || !confirm('Borrar ' + id + '? Se elimina la fila de la hoja.')) return;
    google.script.run.withSuccessHandler(function (data) {
      state.items = state.items.filter(function (item) { return item.id !== id; });
      state.history = data.history;
      state.collectionsLoaded = false;
      state.collectionId = null;
      state.collection = null;
      state.collectionEditor = null;
      if (state.editing === id) state.editing = null;
      render();
      say('Frase ' + id + ' borrada.');
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).deletePhrase(id);
  }

  function importSettings() {
    var delimiter = document.querySelector('input[name="delimiter"]:checked');
    return { text:document.getElementById('import-text').value, delimiter:delimiter && delimiter.value === 'tab' ? '\t' : ',',
      hasHeader:document.getElementById('import-header').checked };
  }

  function previewImport() {
    var settings = importSettings();
    state.importText = settings.text;
    state.importHasHeader = settings.hasHeader;
    state.importDelimiter = settings.delimiter;
    google.script.run.withSuccessHandler(function (data) {
      if (!data.columnCount) return say('No se encontraron columnas para importar.', 'err');
      state.importPreview = { data:data, text:settings.text, delimiter:settings.delimiter };
      render();
      document.getElementById('import-de').value = '0';
      document.getElementById('import-es').value = data.columnCount > 1 ? '1' : '0';
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).previewImport(settings.text, settings.delimiter);
  }

  function importPhrases() {
    var settings = importSettings();
    var preview = state.importPreview;
    if (!preview || preview.text !== settings.text || preview.delimiter !== settings.delimiter) {
      return say('Actualizá la vista previa antes de importar.', 'err');
    }
    var payload = { text:settings.text, delimiter:settings.delimiter, hasHeader:settings.hasHeader,
      deColumn:Number(document.getElementById('import-de').value), esColumn:Number(document.getElementById('import-es').value) };
    google.script.run.withSuccessHandler(function (result) {
      state.importText = '';
      state.importPreview = null;
      state.importHasHeader = true;
      state.importDelimiter = ',';
      state.collectionsLoaded = false;
      state.collectionId = null;
      state.collection = null;
      state.collectionEditor = null;
      reload(function () {
        render();
        say(result.imported + ' importadas; ' + result.duplicate + ' duplicadas y ' + result.empty + ' vacías omitidas.');
      });
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).importPhrases(payload);
  }

  function reload(done) {
    google.script.run.withSuccessHandler(function (data) {
      state.items = data.items;
      state.history = data.history;
      if (done) done(); else render();
    }).withFailureHandler(function (err) { say(err.message, 'err'); }).listPhrases();
  }

  el.app.addEventListener('click', function (event) {
    var button = event.target.closest('[data-act]');
    if (!button) return;
    var act = button.dataset.act;
    if (act === 'switch-view') {
      stopPlayer_();
      state.view = button.dataset.view;
      state.detailId = null;
      state.editing = null;
      if (state.view === 'collections' && !state.collectionsLoaded) {
        render();
        return loadCollections_(render);
      }
      return render();
    }
    if (act === 'open-collection') return openCollection(button.dataset.id);
    if (act === 'collection-back') {
      stopPlayer_();
      state.collectionId = null;
      state.collection = null;
      state.collectionEditor = null;
      return render();
    }
    if (act === 'new-collection') { stopPlayer_(); state.collectionId = null; state.collection = null; state.collectionEditor = 'new'; return render(); }
    if (act === 'edit-collection') { stopPlayer_(); state.collectionEditor = state.collectionId; state.collectionPhraseQuery = ''; return render(); }
    if (act === 'cancel-collection-editor') {
      state.collectionPhraseQuery = '';
      if (state.collectionEditor === 'new') { state.collectionEditor = null; return render(); }
      state.collectionEditor = null;
      return render();
    }
    if (act === 'save-collection') return saveCollection();
    if (act === 'delete-collection') return deleteCurrentCollection();
    if (act === 'add-collection-phrase') return changeCollectionPhrase('add', button.dataset.id);
    if (act === 'remove-collection-phrase') return changeCollectionPhrase('remove', button.dataset.id);
    if (act === 'move-collection-phrase') return changeCollectionPhrase('move', button.dataset.id, Number(button.dataset.direction));
    if (act === 'set-phase') return setPhase_(button.dataset.phase);
    if (act === 'select-session-item') return selectSessionItem_(Number(button.dataset.index));
    if (act === 'toggle-support') return toggleSupport_(button.dataset.support);
    if (act === 'player-toggle') return togglePlayer_();
    if (act === 'player-previous') return movePlayer_(-1);
    if (act === 'player-next') return movePlayer_(1);
    if (act === 'player-restart') return restartPlayer_();
    if (act === 'player-restart-list') return restartSession_();
    if (act === 'study-tab') { state.studyTab = button.dataset.tab; return render(); }
    if (act === 'study') return openStudy(button.dataset.id);
    if (act === 'back-study') { state.detailId = null; state.revealed = false; return render(); }
    if (act === 'reveal') { state.revealed = true; return render(); }
    if (act === 'result') return recordResult(button.dataset.correct === 'true');
    if (act === 'random') {
      var item = randomCandidate(state.items, state.history);
      if (item) return openStudy(item.id);
      state.studyTab = 'history';
      render();
      say('Todas las frases están entre las últimas 20. Repasá una desde el historial.', 'err');
      return;
    }
    if (act === 'new') { state.editing = ''; return render(); }
    if (act === 'edit') { state.view = 'manage'; state.detailId = null; state.editing = button.dataset.id; return render(); }
    if (act === 'cancel-editor') { state.editing = null; return render(); }
    if (act === 'save-phrase') return savePhrase();
    if (act === 'translate') return translateToGerman();
    if (act === 'translate-to-es') return translateToSpanish();
    if (act === 'etymology') return showEtymology();
    if (act === 'page') {
      var pageKey = button.dataset.list === 'manage' ? 'managePage' : 'studyPage';
      state[pageKey] += Number(button.dataset.direction);
      return button.dataset.list === 'manage' ? renderManageList() : renderStudyList();
    }
    if (act === 'delete') return removePhrase(button.dataset.id);
    if (act === 'copy') {
      var text = phrasesToText(managedItems());
      if (!text) return say('No hay frases visibles para copiar.', 'err');
      return copyText(text).then(function () { say('Frases copiadas.'); }).catch(function () { say('No se pudo copiar el texto.', 'err'); });
    }
    if (act === 'preview-import') return previewImport();
    if (act === 'import') return importPhrases();
  });

  el.app.addEventListener('input', function (event) {
    if (event.target.id === 'manage-search') { state.manageQuery = event.target.value; state.managePage = 1; renderManageList(); }
    else if (event.target.id === 'study-search') { state.studyQuery = event.target.value; state.studyPage = 1; renderStudyList(); }
    else if (event.target.id === 'import-text') state.importText = event.target.value;
    else if (event.target.id === 'etymology-source') state.etymologyText = event.target.value;
    else if (event.target.id === 'collection-search') { state.collectionQuery = event.target.value; renderCollections(); }
    else if (event.target.id === 'collection-phrase-search') { state.collectionPhraseQuery = event.target.value; renderCollections(); }
  });
  el.app.addEventListener('change', function (event) {
    if (event.target.id === 'import-header') state.importHasHeader = event.target.checked;
    else if (event.target.id === 'session-order') setSessionOrder_(event.target.value);
    else if (event.target.id === 'player-rate') setPlayerSetting_('rate', event.target.value);
    else if (event.target.id === 'player-pause') setPlayerSetting_('pause', event.target.value);
    else if (event.target.id === 'player-reps') setPlayerSetting_('reps', event.target.value);
  });
  if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', updatePlayerUi_);
  } else if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = updatePlayerUi_;
  }
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && state.detailId) { state.detailId = null; state.revealed = false; render(); }
    else if (event.key === 'Escape' && state.editing !== null) { state.editing = null; render(); }
    else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && state.editing !== null) { event.preventDefault(); savePhrase(); }
  });

  el.screen.innerHTML = '<div class="empty">Cargando frases…</div>';
  reload();
}());
</script>
</body>
</html>
