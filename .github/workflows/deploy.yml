name: Sync Apps Script

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push to Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          npx --yes @google/clasp@3.3.0 show-file-status
          npx --yes @google/clasp@3.3.0 push --force
